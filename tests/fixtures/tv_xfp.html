<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Плеер</title>
<style>
html,body,#root{height:100%;width:100%;margin:0;padding:0;background:#000;overflow:hidden}
#root iframe,#root video-player{position:fixed;inset:0;width:100%;height:100%;border:0}
#retry{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000;color:#ddd;font:15px/1.4 sans-serif;text-align:center;padding:16px;z-index:5}
#retry.on{display:flex}
#retry button{border:0;border-radius:10px;padding:10px 18px;font:600 15px sans-serif;background:#fff;color:#111;cursor:pointer}
</style>
</head><body>
<div id="root"></div><div id="retry"><div>Плеер не загрузился</div><button type="button">Повторить</button></div>
<script>
(function () {
  function fillCvh(root, src) {
    var player = document.createElement('video-player');
    player.id = 'myPlayer';
    player.setAttribute('data-title-id', src.title_id);
    player.setAttribute('data-publisher-id', src.pub_id);
    player.setAttribute('data-aggregator', src.aggregator);
    player.setAttribute('is-show-voice-only', 'false');
    root.appendChild(player);
    var s = document.createElement('script');
    s.src = src.script;
    document.head.appendChild(s);
  }
  function fillIframe(root, url, title) {
    var frame = document.createElement('iframe');
    frame.src = url;
    frame.title = title || 'Видеоплеер';
    frame.frameBorder = '0';
    frame.allowFullscreen = true;
    frame.setAttribute('allow', 'autoplay; encrypted-media; fullscreen');
    root.appendChild(frame);
  }
  var retryBox = document.getElementById('retry'), lastParams = '', watch = 0, seq = 0;
  var animeId = '', kd = {s: 0, e: 0, t: 0};
  var kodikHost = /(^|[.])kodik(player)?[.](com|info|biz|cc)$/;
  function kdLoad() { try { return JSON.parse(localStorage.getItem('kdl:' + animeId) || 'null'); } catch (e) { return null; } }
  function kdSave(o) { try { localStorage.setItem('kdl:' + animeId, JSON.stringify(o)); } catch (e) { } }
  function withLast(url) {
    try {
      var u = new URL(url, location.href);
      if (!kodikHost.test(u.hostname) || u.pathname.indexOf('/serial/') !== 0 || u.searchParams.has('episode')) { return url; }
      var l = animeId && kdLoad();
      if (!l || !l.e) { return url; }
      u.searchParams.set('season', String(l.s || 1));
      u.searchParams.set('episode', String(l.e));
      return u.toString();
    } catch (e) { return url; }
  }
  function showRetry(on) { retryBox.className = on ? 'on' : ''; }
  function cvhReady(root) {
    var p = root.querySelector('video-player'), sr = p && p.shadowRoot;
    return !!(p && (p.querySelector('iframe,video') || (sr && sr.querySelector('iframe,video'))));
  }
  function watchCvh(root, my) {
    var n = 0;
    var t = setInterval(function () {
      n++;
      if (my !== seq || n > 300) { clearInterval(t); return; }
      if (cvhReady(root)) { clearInterval(t); showRetry(false); return; }
      if (n === 15) { showRetry(true); }
    }, 1000);
  }
  retryBox.querySelector('button').addEventListener('click', function () { if (lastParams) load(lastParams, 0); });
  function load(params, attempt) {
    var my = ++seq;
    lastParams = params;
    var mid = /(?:^|&)id=([0-9]+)/.exec(params || '');
    animeId = mid ? mid[1] : '';
    kd = {s: 0, e: 0, t: 0};
    showRetry(false);
    clearTimeout(watch);
    fetch('/engine/ajax/controller.php?' + params, {credentials: 'same-origin', cache: 'no-store'})
      .then(function (r) { if (!r.ok && r.status !== 404) { throw new Error('http ' + r.status); } return r.json(); })
      .then(function (out) {
        if (my !== seq) { return; }
        if (!out || !out.status || !out.data) { showRetry(true); return; }
        var root = document.getElementById('root');
        root.textContent = '';
        if (out.data.kind === 'cvh') { fillCvh(root, out.data); watchCvh(root, my); return; }
        fillIframe(root, withLast(out.data.src), out.data.name);
        var fr = root.querySelector('iframe'), loaded = false;
        fr.addEventListener('load', function () { loaded = true; clearTimeout(watch); showRetry(false); });
        watch = setTimeout(function () { if (!loaded && my === seq) { showRetry(true); } }, 15000);
      })
      .catch(function () {
        if (my !== seq) { return; }
        if (attempt < 2) { setTimeout(function () { load(params, attempt + 1); }, 1000 * (attempt + 1)); }
        else { showRetry(true); }
      });
  }
  window.addEventListener('message', function (event) {
    var d = event.data;
    if (d && typeof d === 'object' && typeof d.key === 'string' && d.key.indexOf('kodik_player_') === 0) {
      var kf = document.querySelector('#root iframe');
      if (!kf || event.source !== kf.contentWindow || !animeId) { return; }
      var v = d.value;
      if (d.key === 'kodik_player_current_episode' && v) {
        kd = {s: +v.season || 1, e: +v.episode || 0, t: v.translation ? +v.translation.id || 0 : 0};
      } else if (d.key === 'kodik_player_time_update' && +v >= 20 && kd.e) {
        var l = kdLoad();
        if (!l || l.s !== kd.s || l.e !== kd.e) { kdSave({s: kd.s, e: kd.e, t: kd.t}); }
      }
      return;
    }
    if (d && d.agp === 'kodik' && typeof d.url === 'string') {
      var fr = document.querySelector('#root iframe');
      if (!fr || event.source !== fr.contentWindow) { return; }
      var kh = '';
      try { kh = new URL(d.url).hostname; } catch (er) { return; }
      if (d.url.indexOf('https://') !== 0 || !/(^|[.])kodik(player)?[.](com|info|biz|cc)$/.test(kh)) { return; }
      seq++;
      clearTimeout(watch);
      showRetry(false);
      var root = document.getElementById('root');
      root.textContent = '';
      fillIframe(root, d.url, 'Kodik');
      return;
    }
    if (event.origin !== location.origin || !d || d.action !== 'start') {
      return;
    }
    load(d.params, 0);
  });
  parent.postMessage({action: 'init', name: window.name}, location.origin);
})();
</script>
